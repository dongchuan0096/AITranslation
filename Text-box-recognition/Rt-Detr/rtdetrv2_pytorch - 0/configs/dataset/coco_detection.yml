task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox', ]

# num_classes: 365
# remap_mscoco_category: False

# num_classes: 91
# remap_mscoco_category: False

num_classes: 1
remap_mscoco_category: True


train_dataloader: 
  type: DataLoader
  dataset: 
    type: CocoDetection
    # img_folder: /root/rtdetrv2_pytorch/dataset/dataset/images
    # ann_file: /root/rtdetrv2_pytorch/dataset/dataset/train.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  num_workers: 4
  drop_last: True 
  collate_fn:
    type: BatchImageCollateFuncion


val_dataloader:
  type: DataLoader
  dataset: 
    type: CocoDetection
    # img_folder: /root/rtdetrv2_pytorch/dataset/dataset/images
    # ann_file: /root/rtdetrv2_pytorch/dataset/dataset/val.json

    # img_folder: /root/rtdetrv2_pytorch/dataset/dataset/images
    # ann_file: /root/rtdetrv2_pytorch/dataset/dataset/test.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~ 
  shuffle: False
  num_workers: 4
  drop_last: False
  collate_fn:
    type: BatchImageCollateFuncion
test_dataloader:
  type: DataLoader
  dataset: 
    type: CocoDetection
    img_folder: /root/rtdetrv2_pytorch/dataset/dataset/images
    ann_file: /root/rtdetrv2_pytorch/dataset/dataset/test.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~ 
